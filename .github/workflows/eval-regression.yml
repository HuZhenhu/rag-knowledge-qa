name: Eval Regression

# T0.5 CI 可复现：
# - push / PR 默认分支时：用 evaluation/fixtures/seed_data 种子知识库构建索引 + 跑 10 条 smoke
#   评测（无需 secrets、不依赖 data/ 私有数据），命中率低于阈值即阻断。
# - 全量黄金集评测改为手动触发（workflow_dispatch）：构建 data/ 全量索引 + harder 46 条，
#   对照 evaluation/golden_baseline.json 做精度回归检查。
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  # T3.3: 每周一 03:00 UTC 自动跑全量评测（质量门禁，失败即阻断发布）
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  smoke-regression:
    name: Smoke eval regression (seed fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download embedding / reranker models (models/ is gitignored)
        run: |
          python -m pip install --quiet "huggingface_hub>=0.20"
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          os.makedirs("models/BAAI", exist_ok=True)
          snapshot_download(repo_id="BAAI/bge-m3", local_dir="models/BAAI/bge-m3")
          snapshot_download(repo_id="BAAI/bge-reranker-base", local_dir="models/BAAI/bge-reranker-base")
          EOF

      - name: Build vector index from seed fixtures
        run: python build_index.py --full --data-dir evaluation/fixtures/seed_data

      - name: Run smoke eval (10 cases)
        env:
          PYTHONUNBUFFERED: "1"
        run: python evaluation/eval_baseline.py --engine optimized --cases evaluation/fixtures/test_cases_smoke.json --limit 0 --resolve-parent

      - name: Assert smoke baseline (hit_at_k >= 0.9, context_recall >= 0.8)
        run: |
          python - <<'EOF'
          import glob, json
          path = sorted(glob.glob("evaluation/baseline_*.json"))[-1]
          data = json.load(open(path, encoding="utf-8"))
          agg = next(a for a in data["aggregates"] if a["engine"] == "optimized")
          print("smoke agg:", json.dumps(agg, ensure_ascii=False))
          assert agg["n"] >= 10, f"expected >=10 cases, got {agg['n']}"
          assert agg["hit_at_k"] >= 0.9, f"hit_at_k {agg['hit_at_k']} < 0.9"
          assert agg["context_recall"] >= 0.8, f"context_recall {agg['context_recall']} < 0.8"
          EOF

  # T3.3: weekly (schedule) / manual 触发全量 golden 评测；质量门禁失败 → job 红 → 阻断发布
  weekly-full-regression:
    name: Weekly full golden eval + quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download embedding / reranker models (models/ is gitignored)
        run: |
          python -m pip install --quiet "huggingface_hub>=0.20"
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          os.makedirs("models/BAAI", exist_ok=True)
          snapshot_download(repo_id="BAAI/bge-m3", local_dir="models/BAAI/bge-m3")
          snapshot_download(repo_id="BAAI/bge-reranker-base", local_dir="models/BAAI/bge-reranker-base")
          EOF

      - name: Build vector index (full)
        run: python build_index.py --full

      - name: Run golden eval
        env:
          PYTHONUNBUFFERED: "1"
        run: python evaluation/eval_baseline.py --engine optimized --cases evaluation/test_cases_harder.json --limit 0 --resolve-parent

      - name: Check regression vs golden baseline
        run: |
          latest=$(ls evaluation/baseline_*.json | sort | tail -n 1)
          echo "Comparing against: $latest"
          python evaluation/check_regression.py --current "$latest" --golden evaluation/golden_baseline.json --metric-tol 0.02

      # T3.3: 发布质量门禁 — 检索质量低于硬门槛或较上次回退即退出码 1，阻断发布
      - name: Quality gate (block release on regression)
        run: |
          latest=$(ls evaluation/baseline_*.json | sort | tail -n 1)
          python evaluation/check_quality_gate.py \
            --current "$latest" \
            --baseline evaluation/golden_baseline.json \
            --min-accuracy 0.8 \
            --drop-threshold 0.02 \
            --feedback-bad-ratio 0.5
