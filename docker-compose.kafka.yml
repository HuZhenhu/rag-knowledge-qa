# T2.3 消息队列任务编排 — Kafka 生产编排（交付配置，本机无 Kafka 时不实测）
# 单节点 KRaft Kafka，供 rag-api 以 QUEUE_BACKEND=kafka 联调。
# 用法：docker compose -f docker-compose.kafka.yml up -d
services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: rag-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-api:
    build: .
    container_name: rag-api-kafka
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - QUEUE_BACKEND=kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GROUP_ID=rag-worker
      - VECTOR_STORE_BACKEND=chroma
      - RAG_ENGINE=langchain
    ports:
      - "8000:8000"
